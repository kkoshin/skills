# Cloudflare Worker 配置模板 —— 所有值都是占位符，部署前请全部替换。
#
# 这个文件是全部配置的唯一来源：改渠道/模型/别名都改这里，然后重新部署。
# 不要在 dashboard 里另外配置变量，否则会和这里冲突（见 deployment.md）。

# Worker 名，会出现在最终 URL 里。
# 若用 GitHub 集成部署，这里必须与已有 Worker 同名，否则会新建一个 Worker。
name = "my-ai-proxy"
main = "src/index.js"
compatibility_date = "2026-09-01"
# 本项目不使用任何 Node API，因此不需要 nodejs_compat。

# 如果 dashboard 上残留了旧的 vars，部署时会被删除。想保留 dashboard 上的值
# （不推荐，会让配置来源变成两处）就打开下面这行：
# keep_vars = true


# ─────────────────────────────────────────────────────────────
# [vars] 下的裸键必须写在所有 [vars.*] 子表之前，
# 否则 TOML 会把它们解析进上一个子表里。
# ─────────────────────────────────────────────────────────────
[vars]

# 客户端访问口令。这不是上游 API Key，而是你自己定的暗号。
SECRET_TOKEN = "change-me-secret-token"

# 上游渠道的密钥。token_ref / key_ref 填的就是这里的变量名。
# 生产环境建议改用 `wrangler secret put PROVIDER_A_KEY`，并删掉这里对应的行 ——
# 这个文件会进 git，明文密钥会留在历史里。
PROVIDER_A_KEY = "sk-replace-with-provider-a-key"
PROVIDER_B_KEY = "sk-replace-with-provider-b-key"


# ── 上游渠道 ──────────────────────────────────────────────────
# baseUrl 必填；authType 省略时默认 Authorization: Bearer；
# protocol 省略时默认 anthropic（即上游原生支持 Anthropic Messages）。
[vars.PROVIDERS.provider-a]
baseUrl = "https://api.provider-a.example.com/anthropic"
key_ref = "PROVIDER_A_KEY"

# protocol = "openai"：该上游说的是 OpenAI Chat Completions，Worker 会把
# Anthropic 请求转成 OpenAI 格式发出，并把返回的响应/SSE 流转回 Anthropic 格式。
# authType = "api-key" 表示用 x-api-key 头而不是 Authorization: Bearer。
[vars.PROVIDERS.provider-b]
baseUrl = "https://api.provider-b.example.com/v1"
protocol = "openai"
authType = "api-key"
key_ref = "PROVIDER_B_KEY"


# ── 模型 → 可用渠道 ───────────────────────────────────────────
# 一个模型一段；provider_id 必填。
# token_ref 缺省时回退到该 provider 的 key_ref。
[vars.MODELS]

[[vars.MODELS.model-a]]
provider_id = "provider-a"
token_ref = "PROVIDER_A_KEY"

# 同一模型挂多个渠道：省略 token_ref，回退到 provider-b 的 key_ref。
# 数组顺序不会触发自动故障转移 —— 走哪个渠道只由 model:provider、
# 别名或 DEFAULT_FALLBACK 决定。
[[vars.MODELS.model-a]]
provider_id = "provider-b"

# 模型名里带 "." 时必须加引号，否则 TOML 会把点解析成嵌套表。
[[vars.MODELS."example-3.5"]]
provider_id = "provider-b"


# ── 裸模型名的默认渠道 ────────────────────────────────────────
# 客户端只传模型名（不带 :provider）时走这里。格式 "模型:渠道"。
# 目标必须存在于 MODELS，否则请求会 500。
[vars.DEFAULT_FALLBACK]
model-a = "model-a:provider-a"
"example-3.5" = "example-3.5:provider-b"


# ── 模型别名 ──────────────────────────────────────────────────
# 把客户端发来的模型名映射到 MODELS 里的模型。Claude Code 之类会发官方
# 模型名（claude-sonnet-4-5 等），用别名把它们接到你的模型上。
#
#   值可写成 "model" 或 "model:provider"，后者同时固定渠道。
#   键支持一个 * 通配符；精确匹配优先于通配，通配之间更具体的优先。
#   目标模型必须存在于 MODELS，否则请求会 500。
#   不配置这一节 = 没有别名，Claude Code 的默认模型名会返回 400。
#
# 注意：别名不会出现在 /v1/models 列表里。
[vars.MODEL_ALIASES]
sonnet = "model-a"
"claude-sonnet-*" = "model-a"
haiku = "model-a:provider-b"
